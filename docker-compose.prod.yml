version: '3.8'

# Production-grade Compose configuration with Nginx TLS reverse proxy & internal network security
services:
  nginx:
    image: nginx:1.25-alpine
    container_name: fincore-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - fincore-public-network

  postgres:
    image: postgres:16-alpine
    container_name: fincore-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-fincore_db}
      POSTGRES_USER: ${DB_USER:-fincore_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d
    networks:
      - fincore-private-network
    # Notice: No external ports exposed for database security in production!
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fincore_user} -d ${DB_NAME:-fincore_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fincore-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - fincore-private-network
    # Notice: No external ports exposed for redis cache in production!
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fincore-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-fincore_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-fincore_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ANALYTICS_SERVICE_URL: http://analytics-service:8000
      JWT_SECRET: ${JWT_SECRET}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
    networks:
      - fincore-public-network
      - fincore-private-network

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: fincore-analytics-prod
    restart: always
    environment:
      ENVIRONMENT: production
      PORT: 8000
      INTERNAL_API_KEY: ${ANALYTICS_API_KEY}
    networks:
      - fincore-private-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fincore-frontend-prod
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - fincore-public-network

networks:
  fincore-public-network:
    driver: bridge
  fincore-private-network:
    internal: true # Strict internal network isolation (no internet / host ingress)

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
