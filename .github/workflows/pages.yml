name: Deploy FinCore to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Build static Next.js export
        env:
          STATIC_EXPORT: 'true'
          NEXT_PUBLIC_BASE_PATH: '/FinCore'
        run: npm --prefix frontend run build

      - name: Disable Jekyll
        run: touch ./frontend/out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/out
          branch: gh-pages
          commit-message: "deploy: automated FinCore GitHub Pages release [skip ci]"
