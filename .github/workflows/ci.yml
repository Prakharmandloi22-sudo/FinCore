name: FinCore Continuous Integration & Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Backend Tests & Double-Entry Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Run Backend Test Suite (Jest)
        run: npm --prefix backend test

      - name: Run Capstone Challenge Verification
        run: npm --prefix backend run test:capstone

  test-analytics:
    name: Python Financial Calculations & Risk Analytics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: analytics-service/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r analytics-service/requirements.txt

      - name: Run Pytest Calculations & Risk Engine
        run: python -m pytest analytics-service/tests -v

  build-frontend:
    name: Frontend Build & Typecheck (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Build Next.js Production Bundle
        run: npm --prefix frontend run build

