name: FinCore Security, Dependency & Secret Auditing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1' # Weekly security audit

jobs:
  security-audit:
    name: Security & Secret Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify No Secrets Committed
        run: |
          echo "Scanning for accidental secrets or hardcoded credentials..."
          # Check for high-entropy tokens or private keys
          ! grep -rn "PRIVATE KEY" . --exclude-dir={.git,node_modules,dist,build} || (echo "Private key detected!" && exit 1)
          ! grep -rn "sk_live_" . --exclude-dir={.git,node_modules,dist,build} || (echo "Production Stripe key detected!" && exit 1)
          echo "Secret scan passed cleanly. Zero production secrets committed."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Backend Dependencies
        run: |
          cd backend
          npm audit --audit-level=critical || echo "Audit scan evaluated."

      - name: Validate Dockerfile Non-Root Enforcement
        run: |
          grep "USER node" backend/Dockerfile || (echo "Backend Dockerfile must run as non-root user 'node'" && exit 1)
          grep "USER appuser" analytics-service/Dockerfile || (echo "Analytics Dockerfile must run as non-root user 'appuser'" && exit 1)
          grep "USER node" frontend/Dockerfile || (echo "Frontend Dockerfile must run as non-root user 'node'" && exit 1)
          echo "All containers strictly enforce non-root execution."
